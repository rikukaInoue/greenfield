{{define "layout"}}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .Body}} — greenfield admin</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<header>
  <h1><a href="/">greenfield admin</a></h1>
  {{with .Viewer}}<span class="who">{{.Subject}} <span class="badge">AAL{{.AAL}}</span></span>
  <form method="post" action="/logout"><button class="link" type="submit">ログアウト</button></form>{{end}}
</header>
<div class="shell">
{{if .Viewer}}<nav class="sidebar" aria-label="メニュー">
<ul>
{{range .Nav}}{{if .Disabled}}<li class="disabled"><span>{{.Label}}</span><small>準備中</small></li>
{{else}}<li{{if eq .Key $.Active}} class="active" aria-current="page"{{end}}><a href="{{.Href}}">{{.Label}}</a></li>
{{end}}{{end}}</ul>
</nav>{{end}}
<main>
{{template "content" .Body}}
</main>
</div>
</body>
</html>{{end}}
