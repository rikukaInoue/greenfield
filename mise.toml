# ツールのバージョン固定とタスク定義。`mise install` で揃え、`mise run` でタスク一覧から選べる。
[tools]
go = "1.26.6"
sqlc = "1.31.1"
"golangci-lint" = "2.14.0"
"ubi:oasdiff/oasdiff" = "1.32.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"osv-scanner" = "2.6.0"
trivy = "0.74.0"
node = "24.21.0"
pnpm = "12.6.0"

[env]
COMPOSE_FILE = "deploy/compose/compose.yaml"
# 開発用の実装（署名検証のない擬似トークン、固定の資格情報）は ENV が許可リストに
# 入っていないと組み立てられない。未設定は本番として扱われる（docs/adr/0016）
ENV = "dev"

# --- ビルド・検証 ---
# モジュールは go.work の use から拾う。CI はワークスペースを切って（GOWORK=off）各モジュールを
# 単体でビルドし、go.mod の自己完結性＝モジュール境界を毎回検証する
# （ワークスペースモードでは use 内の全モジュールが require なしで import できてしまうため）。

[tasks.modules]
description = "go.work に登録されたモジュール一覧。MODULES（空白区切り）で絞れる"
hide = true
run = "dev/scripts/modules.sh"

[tasks."build:ws"]
description = "ワークスペースモードで全モジュールをビルド（日常用）"
run = 'go build $(mise run modules | sed "s#\$#/...#")'

[tasks.build]
description = "各モジュールを GOWORK=off で単体ビルド（CI相当。境界チェックはこちらでしか効かない）"
run = 'for m in $(mise run modules); do echo "== $m"; (cd $m && GOWORK=off go build ./...) || exit 1; done'

[tasks.vet]
description = "各モジュールを GOWORK=off で go vet"
run = 'for m in $(mise run modules); do echo "== $m"; (cd $m && GOWORK=off go vet ./...) || exit 1; done'

[tasks.vuln]
description = "各モジュールを GOWORK=off で govulncheck（依存 CVE を到達性つきで検査）"
# ワークスペースモードでは解析が use の全モジュールに広がり、どのモジュールの依存として
# 到達しているのかが分からなくなる。build / vet / test と同じくモジュール単位で回す。
# 対象0件は「検査が空振りしている」状態なので落とす。
run = """
n=0
for m in $(mise run modules); do
  echo "== $m"
  (cd $m && GOWORK=off govulncheck ./...) || exit 1
  n=$((n + 1))
done
echo "検査したモジュール: $n"
if [ "$n" -eq 0 ]; then
  echo "govulncheck: 対象が0件。検査が空振りしている" >&2
  exit 1
fi
"""

[tasks.test]
description = "各モジュールを GOWORK=off で go test（DB系のテストは mysql 到達時のみ走る）"
# -count=1 はテスト結果のキャッシュを無効にする（ビルドキャッシュは効いたまま）。
# DB を使うテストは外部の MySQL に依存していて入力の純粋な関数ではないので、
# Go は「MySQL が消えた」ことを知れず、過去の ok を返し続ける。CI でビルド
# キャッシュを復元するようにした結果、実際に (cached) で素通りしていた。
run = 'for m in $(mise run modules); do echo "== $m"; (cd $m && GOWORK=off go test -count=1 ./...) || exit 1; done'

[tasks.fmt]
description = "gofmt 差分があれば失敗"
run = 'files=$(gofmt -l $(mise run modules)); if [ -n "$files" ]; then echo "$files"; exit 1; fi'

[tasks.tidy]
description = "各モジュールを GOWORK=off で go mod tidy"
run = 'for m in $(mise run modules); do (cd $m && GOWORK=off go mod tidy) || exit 1; done'

[tasks.check]
description = "fmt + build + vet + test + lint（queries / imports）+ sqlc:check + api:check + client:check（CI 相当。schema:check は DB が要るので別）"
depends = ["fmt", "build", "vet", "test", "lint:queries", "lint:imports", "lint:replaces", "lint:secure-defaults", "lint:alerts", "lint:drift", "sqlc:check", "api:check", "client:check", "api:breaking:test", "baseline:test"]

# --- sqlc とスキーマ整合 ---

[tasks.services]
description = "services/ 配下のサービスモジュール一覧（*-client を除く）。MODULES で絞れる"
hide = true
run = "dev/scripts/modules.sh --services"

[tasks.sqlc]
description = "各サービスで sqlc generate（生成型は repository/internal/sqlcgen）。クエリのないサービスは明示して飛ばす"
run = 'for s in $(mise run services); do if [ -z "$(find $s/db/queries -name "*.sql" 2>/dev/null)" ]; then echo "== $s: クエリなし（sqlc 対象外）"; continue; fi; echo "== $s"; (cd $s && sqlc generate) || exit 1; done'

[tasks."sqlc:check"]
description = "sqlc の生成物がクエリ・スキーマと一致しているか検証（CI）"
run = 'for s in $(mise run services); do if [ -z "$(find $s/db/queries -name "*.sql" 2>/dev/null)" ]; then echo "== $s: クエリなし（sqlc 対象外）"; continue; fi; echo "== $s"; (cd $s && sqlc diff) || exit 1; done'

[tasks."schema:dump"]
description = "空DBにマイグレーション全適用 → mysqldump で db/schema.sql を更新（sqlc の入力）"
depends = ["db:up"]
run = 'for s in $(mise run services); do dev/scripts/schema-dump.sh $(basename $s) --write || exit 1; done'

[tasks."schema:check"]
description = "db/schema.sql がマイグレーションと一致しているか検証（CI）"
depends = ["db:up"]
run = 'for s in $(mise run services); do dev/scripts/schema-dump.sh $(basename $s) --check || exit 1; done'

[tasks."fk:check"]
description = "database を跨ぐ外部キーが無いことを検証（跨ぐと他サービスのデプロイが 1205 で落ちる）"
depends = ["db:up"]
# **MODULES で絞らずに全サービスを渡す。** 跨ぐ FK は 2 つ以上の database が揃っていないと
# 存在し得ないので、1 サービス分しか適用されていない DB に対して実行しても必ず通る。
# サービス名を引数で渡し、その database が実際に在ることをスクリプト側で確かめる
run = 'dev/scripts/no-cross-db-fk.sh $(MODULES= dev/scripts/modules.sh --services | xargs -n1 basename)'

[tasks."fk:report"]
description = "跨ぐ外部キーの棚卸し(警告モード)。移行途中の「あと何が切れれば独立か」を出す(#197)"
depends = ["db:up"]
run = 'FK_CHECK_MODE=warn dev/scripts/no-cross-db-fk.sh $(MODULES= dev/scripts/modules.sh --services | xargs -n1 basename)'

[tasks."schema:check-live"]
description = "実行時の DB が db/schema.sql と一致しているか検証（生成と実行の乖離を検出する）"
depends = ["db:up"]
run = 'for s in $(mise run services); do dev/scripts/schema-dump.sh $(basename $s) --check-live || exit 1; done'

# --- API 契約（huma → OpenAPI → oasdiff） ---

[tasks.api]
description = "huma の型から api/<service>/<listener>.openapi.json を生成（api/ は手書きしない）"
run = "go run ./dev/genapi"

[tasks."api:docs"]
description = "api/ の OpenAPI JSON から人が読める HTML を生成（api-docs/。#77）"
run = "dev/scripts/api-docs.sh"

[tasks."api:check"]
description = "api/ の生成物がコードと一致しているか検証（CI）"
run = "go run ./dev/genapi -check"

[tasks.client]
description = "api/<service>/internal.openapi.json から services/<service>-client を oapi-codegen で生成（手書きしない）"
run = "dev/scripts/client-gen.sh"

[tasks."client:check"]
description = "生成クライアントがスペックと一致しているか検証（CI）。MODULES で絞れる"
run = "dev/scripts/client-gen.sh --check"

[tasks."api:breaking:test"]
description = "API のバージョニング規則（api:breaking）が違反を正しく落とすか検査する"
run = "dev/scripts/api-breaking.test.sh"

[tasks."trivy:check"]
description = "Trivy で設定（Dockerfile/compose/Terraform）とシークレットを検査（#187）。除外は .trivyignore.yaml（理由+期限必須、期限切れは自動で再検出）"
run = "dev/scripts/trivy-check.sh"

[tasks."trivy:image"]
description = "trivy:check に加えてイメージ3本をビルドして OS パッケージ CVE を検査（日次。security.yml）"
run = "dev/scripts/trivy-check.sh image"

[tasks."web:vuln"]
description = "frontend 依存の既知脆弱性（#183）。osv-scanner + pnpm audit --prod を差分運用（ADR 0021）で"
run = "dev/scripts/frontend-deps-check.sh"

[tasks."baseline:test"]
description = "差分運用の共通機構（baseline-diff.sh、ADR 0021）が破るべき形を正しく落とすか検査する"
run = "dev/scripts/baseline-diff.test.sh"

[tasks."api:breaking"]
description = "base（既定 origin/main）に対する破壊的変更を検出し、メジャー未更新なら失敗（CI）"
run = "dev/scripts/api-breaking.sh"

[tasks."lint:imports"]
description = "モジュール内の import 規律（replicaview / 差し込み口）と gosec（#188）を全モジュールで検証する"
# gosec の導入(#188)で対象を services だけから全モジュールへ広げた。SAST の価値が
# 一番高いのは認証・認可・HTTP を持つ core であるため。除外は .golangci.yml に理由つき
run = 'cfg=$PWD/.golangci.yml; for s in $(mise run modules); do echo "== $s"; (cd $s && GOWORK=off golangci-lint run --config "$cfg" ./...) || exit 1; done'

[tasks."lint:drift"]
description = "共有依存のバージョン乖離を観測する(#205)。警告のみ(exit 0)——fail にすると依存更新 PR が片側から通せない。締めるなら -strict"
run = "go run ./dev/driftcheck"

[tasks."audit:checks"]
description = "検査の検査: 検査ツール自身の回帰テストを一括実行(#226。四半期 + 手動)"
run = "dev/scripts/meta-audit.sh"

[tasks."lint:alerts"]
description = "アラートルールの単体テスト(promtool)。閾値を跨ぐ系列で発火する/しないを機械検証(#224)"
run = "docker run --rm -v ./deploy/compose/prometheus:/w --entrypoint promtool prom/prometheus:v3.9.1 test rules /w/alerts_test.yml"

[tasks."lint:secure-defaults"]
description = "守りの既定値の検査: 非root/保存時暗号化/平文秘密なし(#210 #212 #213)"
run = "dev/scripts/secure-defaults-check.sh"

[tasks."lint:replaces"]
description = "モジュール間 require の replace 漏れと、Dockerfile の COPY 漏れを検査(#163)"
run = "dev/scripts/replace-check.sh"

[tasks."lint:queries"]
description = "クエリが自ドメインのテーブルだけを参照しているか検証（許可リスト = db/schema.sql）"
run = 's=$(mise run services); if [ -z "$s" ]; then echo "対象サービスなし（lint:queries 対象外）"; else go run ./dev/querylint $s; fi'

# --- ローカルインフラ（docker compose） ---

[tasks."db:up"]
description = "mysql を起動しヘルシーになるまで待つ。CI では起動済みとみなす"
run = '[ -n "${CI:-}" ] || docker compose up -d --wait mysql'

[tasks."s3:up"]
description = "オブジェクトストレージ（RustFS）を起動しバケットを用意する。CI では起動済みとみなす"
run = ['[ -n "${CI:-}" ] || docker compose up -d --wait rustfs', 'go run ./dev/s3admin ensure-buckets']

[tasks."events:up"]
description = "イベントバス（LocalStack SNS/SQS）を起動しトピック・キューを用意する。CI では起動済みとみなす"
run = ['[ -n "${CI:-}" ] || docker compose up -d --wait localstack', "go run ./dev/eventadmin ensure-topics"]

[tasks."infra:up"]
description = "ローカル依存を一括起動（mysql + RustFS + flagd + LocalStack + バケット + トピック + マイグレーション）"
# depends は並行実行される。docker compose を同時に呼ぶと同一プロジェクトのネットワーク作成で
# 競合するため（Network ... already exists）、1回の compose 呼び出しにまとめる
run = [
  # flagd は healthcheck を書けないため --wait の対象にできない。起動だけ同じ呼び出しで行い、
  # 到達性はホスト側の TCP プローブで待つ
  "docker compose up -d --wait mysql rustfs localstack",
  "docker compose up -d flagd",
  "dev/scripts/wait-for-flagd.sh",
  "go run ./dev/s3admin ensure-buckets",
  "go run ./dev/eventadmin ensure-topics",
  'for s in $(mise run services); do n=$(basename $s); echo "== $n expand"; go run ./$s/cmd/$n migrate expand || exit 1; done',
  'for s in $(mise run services); do n=$(basename $s); echo "== $n contract"; go run ./$s/cmd/$n migrate contract || exit 1; done',
]

[tasks."obs:up"]
description = "昇格シグナルの観測(prometheus + grafana)を立てる。ダッシュボード: http://127.0.0.1:3001 (#59)"
dir = "deploy/compose"
run = "docker compose --profile deploy --profile obs up -d --wait prometheus grafana"

[tasks."obs:down"]
description = "観測スタックを落とす"
dir = "deploy/compose"
run = "docker compose --profile obs rm -sf prometheus grafana"

[tasks."tier2:up"]
description = "Tier 2(Caddy + 本番アダプタの photo + authz)を起動(internal-07 / #55)"
dir = "deploy/compose"
run = "docker compose -f compose.yaml -f tier2.yaml --profile deploy up -d --build --wait caddy authz photo"

[tasks."tier2:down"]
description = "Tier 2 を落とす(base の Tier 1 構成は残る)"
dir = "deploy/compose"
run = "docker compose -f compose.yaml -f tier2.yaml --profile deploy rm -sf caddy authz && docker compose --profile deploy up -d --wait photo"

[tasks."db:down"]
description = "コンテナを停止"
run = "docker compose down"

[tasks."db:reset"]
description = "データボリュームごと破棄して作り直す（init SQL を再実行させたいとき）"
run = "docker compose down -v && docker compose up -d --wait mysql"

[tasks."db:shell"]
description = "mysql クライアント（root）に入る"
run = "docker exec -it greenfield-mysql mysql -uroot -proot"

[tasks."migrate:expand"]
description = "全サービスの expand を適用（デプロイ前ステップ相当）"
depends = ["db:up"]
run = 'for s in $(mise run services); do n=$(basename $s); echo "== $n expand"; go run ./$s/cmd/$n migrate expand || exit 1; done'

[tasks."migrate:contract"]
description = "全サービスの contract を適用（キュー消化。本番では後続リリースで明示実行する）"
depends = ["db:up"]
run = 'for s in $(mise run services); do n=$(basename $s); echo "== $n contract"; go run ./$s/cmd/$n migrate contract || exit 1; done'

[tasks.migrate]
description = "ローカル・CI の DB を最新の姿にする（expand → contract）。sqlc の入力と一致させるため両方流す"
depends = ["db:up"]
# depends は並行実行なので順序を保証できない。contract は expand の後でなければ
# 対象の列が存在せず空振りする。run の配列は順に実行される
run = [
  'for s in $(mise run services); do n=$(basename $s); echo "== $n expand"; go run ./$s/cmd/$n migrate expand || exit 1; done',
  'for s in $(mise run services); do n=$(basename $s); echo "== $n contract"; go run ./$s/cmd/$n migrate contract || exit 1; done',
]

[tasks."authz:up"]
description = "OpenFGA を起動する（mysql datastore、migrate 込み）。CI では起動済みとみなす"
run = '[ -n "${CI:-}" ] || docker compose up -d --wait openfga'

[tasks."authz:run"]
description = "authz サービスを起動する（:8100。裏は OpenFGA :8280）"
depends = ["authz:up"]
run = "go run ./platform/authz/cmd/authz"

[tasks."authz:check"]
description = "authz サービスの判定・一覧・冪等性・作成直後可視を実 OpenFGA で検証（check #7）"
depends = ["authz:up"]
run = "dev/scripts/authz-check.sh"

[tasks."authn:check"]
description = "本番アダプタ（oidcauthn+authzhttp）へ差し替えた photo を実 Keycloak のトークンで一気通貫検証（#27）"
run = "dev/scripts/authn-check.sh"

[tasks."authz:sweep"]
description = "認可の総当たり（#182）。全リスナーの全ルートへ他人のトークンと無認証で当て、拒否の形以外を落とす。前提: 稼働中のスタック（mise run run など）"
run = "go run ./dev/authsweep"

[tasks."keycloak:up"]
description = "Keycloak を起動し realm を import する。CI では起動済みとみなす"
run = '[ -n "${CI:-}" ] || docker compose up -d --wait keycloak'

[tasks."keycloak:check"]
description = "realm.json どおりのクレームが載るか検証（check #13）"
depends = ["keycloak:up"]
run = "dev/scripts/keycloak-claims.sh"

[tasks."keycloak:export"]
description = "動いている Keycloak の realm を realm.json へ書き戻す（Admin Console で変えたら必ず実行）"
run = "dev/scripts/keycloak-export.sh"

[tasks."flags:up"]
description = "フィーチャーフラグ（flagd）を起動し、到達可能になるまで待つ。CI では file 読みなので不要"
# flagd は distroless でシェルも curl も持たないためコンテナ内 healthcheck を書けない。
# ホスト側から TCP で待つ（待たないと直後の起動が既定値のまま縮退する）
run = '[ -n "${CI:-}" ] || { docker compose up -d flagd && dev/scripts/wait-for-flagd.sh; }'

[tasks.flags]
description = "フラグの現在値を表示する"
run = "docker compose exec -T flagd cat /etc/flagd/flags.json 2>/dev/null || cat deploy/compose/flagd/flags.json"

[tasks.load]
description = "負荷をかける: mise run load -- -duration 60s -rps 20"
run = "go run ./dev/loadgen"

[tasks."rename:drill"]
description = "改名ドリル（#25 / #21 / #15）。--old/--new/--flag/--backfill が必須"
run = "dev/scripts/rename-drill.sh"

[tasks.columncheck]
description = "改名中の新旧カラムの一致を検算: mise run columncheck -- -old <旧> -new <新> [-watch 2s]"
run = "go run ./dev/columncheck"

[tasks.reclaim]
description = "アップロード未完了の写真を回収する（既定は1時間以上前・100件まで）: mise run reclaim -- --older-than 0s --limit 1000"
run = "go run ./services/photo/cmd/photo reclaim"

[tasks."reclaim:all"]
description = "検証で溜まった未完了の写真をすべて回収する（loadgen の後片付け）"
run = "go run ./services/photo/cmd/photo reclaim --older-than 0s --limit 100000"

[tasks."migrate:status"]
description = "各サービスのマイグレーション状態"
run = 'for s in $(mise run services); do n=$(basename $s); echo "== $n status"; go run ./$s/cmd/$n migrate status || exit 1; done'

# --- 実行 ---

[tasks.run]
description = "全サービスを1プロセスで起動（Tier 1: photo :8080/:8081/:8082）"
run = "go run ./dev/allinone"

[tasks.token]
description = "開発用の擬似トークンを発行: mise run token -- --user alice [--aal 2]"
run = "go run ./dev/devtoken"

# --- フロントエンド（frontend/、React Router SSR） ---

[tasks."web:install"]
description = "frontend/ の依存を入れる（lockfile 固定）"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks."web:gen"]
description = "api/ の OpenAPI から TS の型を再生成（frontend/packages/*-api）"
dir = "frontend"
run = "pnpm gen"

[tasks."web:dev"]
description = "SSR の開発サーバー（:5173）。photo は mise run run で起動しておく"
depends = ["web:install"]
dir = "frontend"
run = "pnpm dev"

[tasks."web:check"]
description = "生成型の一致 + typecheck + 単体テスト + build（CI）"
depends = ["web:install"]
dir = "frontend"
run = [
  "pnpm --filter @greenfield/photo-api gen:check",
  "pnpm --filter @greenfield/gear-api gen:check",
  "pnpm typecheck",
  "pnpm --filter @greenfield/web test:unit",
  "pnpm build",
]

[tasks."web:e2e"]
description = "ブラウザ E2E（Playwright）。photo と SSR(:3000) は未起動なら自動で立てる"
depends = ["web:install"]
dir = "frontend"
run = "pnpm --filter @greenfield/web test:e2e"

[tasks.scaffold]
description = "新サービスの骨格を生成: mise run scaffold <name>"
run = "go run ./dev/scaffold new-service"
