# ローカル一式（Tier 1: インフラのみコンテナ、Goアプリはホストプロセス）。
# 認証(keycloak)・openfga・localstack・flagd・otel は各Phaseで追加する。
name: greenfield

services:
  mysql:
    image: mysql:8.4
    container_name: greenfield-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      # database・ユーザー・GRANT の作成はDBレベルの操作としてここ（platform運用相当）が持つ。
      # サービスのマイグレーションには入れない（conventions/internal-05）。
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 画像オブジェクト。S3 互換。署名付きURLを実際に検証できることが選定理由
  # （docs/adr/0008-object-storage-rustfs.md）。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: greenfield-rustfs
    environment:
      RUSTFS_ACCESS_KEY: test
      RUSTFS_SECRET_KEY: testtest
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 署名なしのリクエストは 403 を返すので、到達性は接続の成否で見る
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # SNS / SQS FIFO（Phase 4.2 のイベント基盤）。S3 は RustFS を使うため対象外。
  # まだ使うコードが無いので既定では起動しない（profiles）。Phase 4.2 で外す。
  # 起動する場合: docker compose --profile events up -d localstack
  localstack:
    profiles: ["events"]
    image: localstack/localstack:4
    container_name: greenfield-localstack
    environment:
      SERVICES: sns,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  # フィーチャーフラグ。定義はリポジトリ内のファイルを git 管理し、変更を PR レビューに載せる
  flagd:
    image: ghcr.io/open-feature/flagd:latest
    container_name: greenfield-flagd
    command: ["start", "--uri", "file:/etc/flagd/flags.json"]
    ports:
      # 8015 は flag sync service。アプリは定義をここから同期してプロセス内で評価する（docs/adr/0013）。
      # 8013（リモート評価）は使わない。SSR はフラグを評価しない（docs/adr/0014）
      - "8015:8015"
    volumes:
      - ./flagd:/etc/flagd:ro
    # イメージは distroless でシェルも curl も持たないため、コンテナ内の healthcheck は書けない。
    # 到達性は依存する側（アプリ）が既定値へ倒れる形で吸収する。

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: greenfield-keycloak
    # realm-as-code: realm.json を毎回 import して同一状態を再現する（docs/03-platform.md）。
    # Admin Console で手で変えたら export して realm.json へ必ず戻すこと。
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      # 8180 は issuer と一致させる（docs/02-architecture.md）。Tier 1 では Go アプリを
      # ホストプロセスで動かすので、ブラウザ・アプリ双方から同じ名前で解決する
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # 26 系は管理用ポート 9000 に health エンドポイントがある。イメージに curl は無いが
      # bash と /dev/tcp は使えるので、それで待つ
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/greenfield HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # --- デプロイ先（ステージ 2.3 / #46）------------------------------------
  # 手元マシンの compose がデプロイ先。ECS は Phase 7 で、そのときは
  # このサービス定義がタスク定義に置き換わる（デプロイ順序の形は変えない）。
  #
  # 既定では起動しない（profiles）。開発の日常は `mise run run`（allinone）で、
  # ここはデプロイ順序の検証と「動いているものを差し替える」実演に使う。
  #   docker compose --profile deploy up -d --build photo
  photo:
    profiles: ["deploy"]
    build:
      # モジュール境界を跨がないよう、ビルドは GOWORK=off でこのモジュールだけを閉じる
      context: ../..
      dockerfile: services/photo/Dockerfile
    image: greenfield/photo:local
    container_name: greenfield-photo
    environment:
      ENV: dev
      # ログの詳細度は**外から回せなければ意味がない**。コードに LOG_LEVEL の口を作っただけでは
      # compose がホストの環境変数を転送しないので届かない（#142 で実測）。
      LOG_LEVEL: ${LOG_LEVEL:-}
      # 開発機で人間向けに読みたいときだけ text。既定は JSON（1形式に揃える）
      LOG_FORMAT: ${LOG_FORMAT:-}
      PHOTO_EXTERNAL_ADDR: ":8080"
      PHOTO_INTERNAL_ADDR: ":8081"
      PHOTO_ADMIN_ADDR: ":8082"
      PHOTO_DSN: "photo_app:photo_app@tcp(mysql:3306)/photo?parseTime=true"
      LOCALAUTHZ_DSN: "localauthz:localauthz@tcp(mysql:3306)/localauthz"
      FLAGD_HOST: flagd
      FLAGD_PORT: "8015"
      PHOTO_IMAGE_BUCKET: photo-images
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://rustfs:9000"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: testtest
    ports:
      - "18080:8080"
      - "18081:8081"
      - "18082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # デプロイの成否をこの healthcheck で判定する（workflow の healthcheck ジョブも同じ口を叩く）
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # gear も同じ形で deploy できるようにする(#131)。1 サービスしか deploy できないと
  # 2.4「別サービスは互いに待たない」(#26)を実測できない。
  gear:
    profiles: ["deploy"]
    build:
      context: ../..
      dockerfile: services/gear/Dockerfile
    image: greenfield/gear:local
    container_name: greenfield-gear
    environment:
      ENV: dev
      # ログの詳細度は**外から回せなければ意味がない**。コードに LOG_LEVEL の口を作っただけでは
      # compose がホストの環境変数を転送しないので届かない（#142 で実測）。
      LOG_LEVEL: ${LOG_LEVEL:-}
      # 開発機で人間向けに読みたいときだけ text。既定は JSON（1形式に揃える）
      LOG_FORMAT: ${LOG_FORMAT:-}
      GEAR_EXTERNAL_ADDR: ":8090"
      GEAR_INTERNAL_ADDR: ":8091"
      GEAR_ADMIN_ADDR: ":8092"
      # gear はまだ自 database を使わない(Config に DSN が無い)。持ったら photo と同じ形で足す
      LOCALAUTHZ_DSN: "localauthz:localauthz@tcp(mysql:3306)/localauthz"
    ports:
      - "18090:8090"
      - "18091:8091"
      - "18092:8092"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql-data:
  rustfs-data:
