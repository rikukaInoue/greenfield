# ローカル一式（Tier 1: インフラのみコンテナ、Goアプリはホストプロセス）。
# 認証(keycloak)・openfga・localstack・flagd・otel は各Phaseで追加する。
name: greenfield

services:
  mysql:
    image: mysql:8.4
    container_name: greenfield-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      # database・ユーザー・GRANT の作成はDBレベルの操作としてここ（platform運用相当）が持つ。
      # サービスのマイグレーションには入れない（conventions/internal-05）。
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 画像オブジェクト。S3 互換。署名付きURLを実際に検証できることが選定理由
  # （docs/adr/0008-object-storage-rustfs.md）。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: greenfield-rustfs
    environment:
      RUSTFS_ACCESS_KEY: test
      RUSTFS_SECRET_KEY: testtest
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 署名なしのリクエストは 403 を返すので、到達性は接続の成否で見る
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # SNS / SQS FIFO（Phase 4.2 のイベント基盤）。S3 は RustFS を使うため対象外
  localstack:
    image: localstack/localstack:4
    container_name: greenfield-localstack
    environment:
      SERVICES: sns,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  # フィーチャーフラグ。定義はリポジトリ内のファイルを git 管理し、変更を PR レビューに載せる
  flagd:
    image: ghcr.io/open-feature/flagd:latest
    container_name: greenfield-flagd
    command: ["start", "--uri", "file:/etc/flagd/flags.json"]
    ports:
      # 8015 は flag sync service。Go 側は定義をここから同期してプロセス内で評価する（docs/adr/0013）
      - "8015:8015"
      # 8013 はリモート評価。SSR が現状こちらを使っているため残す。
      # 取得元を AppConfig Agent へ寄せる際に両方まとめて外す
      - "8013:8013"
    volumes:
      - ./flagd:/etc/flagd:ro
    # イメージは distroless でシェルも curl も持たないため、コンテナ内の healthcheck は書けない。
    # 到達性は依存する側（アプリ）が既定値へ倒れる形で吸収する。

volumes:
  mysql-data:
  rustfs-data:
