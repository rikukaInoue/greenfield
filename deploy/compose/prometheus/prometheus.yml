# 昇格シグナルの scrape(#59)。ターゲットはアプリの METRICS_ADDR(契約の面とは別ポート)。
# サービスが起動していないターゲットは down と出るだけで害はない(tier2 の authz 等)。
global:
  scrape_interval: 5s
  evaluation_interval: 15s

# 常設アラート(#224)。各ルールは docs/runbooks/ の手順と対で、
# ルール自体の発火条件は promtool の単体テスト(alerts_test.yml)で機械検証する
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: photo
    static_configs: [{ targets: ["photo:9091"] }]
  - job_name: gear
    static_configs: [{ targets: ["gear:9092"] }]
  - job_name: authz
    static_configs: [{ targets: ["authz:9093"] }]
