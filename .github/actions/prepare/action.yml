name: prepare
description: mise のツールと Go のキャッシュを用意し、services の MySQL に database と GRANT を流す
inputs:
  cache-key:
    description: >
      Go のビルドキャッシュを分ける単位。モジュールごとに別のキャッシュにする
      （1つのキーを共有すると、先に保存したジョブ以外は積み増せない）。
    required: false
    default: shared
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        install: true
        cache: true

    # ツールだけキャッシュしても、毎ジョブが依存グラフを丸ごとコンパイルし直す。
    # 実測（run 36302711486）で check ステップが 43〜252 秒かかっていた主因がこれ。
    - name: Go とリンタのキャッシュ
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/.cache/golangci-lint
        key: go-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
        # go.sum が変わっても直前のキャッシュから積み増せるようにする
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.cache-key }}-

    - name: mysql クライアントを用意する
      shell: bash
      run: mysql --version || sudo apt-get install -y --no-install-recommends mysql-client

    - name: database と GRANT を用意する
      # compose の init スクリプトと同じものを流す。
      # docker-entrypoint-initdb.d は services: では使えないため明示的に適用する。
      shell: bash
      run: |
        for f in deploy/compose/mysql/init/*.sql; do
          mysql -h 127.0.0.1 -uroot -proot < "$f"
        done
