# 継続的脆弱性検査のうち、「コードが変わらなくても結果が変わる」ものを定期実行する（#194）。
#
# PR ごとの検査は ci.yml の go ジョブに入っている（matrix で変更されたモジュールだけ）。
# こちらが要るのは、**脆弱性データベースが増えるから**である。依存も Go のバージョンも
# 1バイトも変わっていないのに、明日には affected になる。差分検出では拾えない。
name: Security

on:
  schedule:
    # 毎日 05:17 JST。分をずらしてあるのは GitHub 側の毎時0分の混雑を避けるため
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # 未設定は本番として扱われ、開発用の実装が組み立てられない（docs/adr/0016）
  ENV: ci

jobs:
  govulncheck:
    name: govulncheck（全モジュール）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # MODULES を渡さないので go.work の全モジュールが対象になる。
      # mysql: false — 依存グラフの解析だけで DB には触らない
      - uses: ./.github/actions/prepare
        with:
          cache-key: vuln
          mysql: "false"

      # govulncheck は Go の toolchain 自体の CVE も報告する。
      # その場合は依存ではなく mise.toml の go を上げることになる
      - name: 依存と toolchain の CVE
        run: mise run vuln

  frontend-deps:
    name: frontend 依存 + Node ランタイム
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          cache-key: vuln-frontend
          mysql: "false"

      # PR ゲート（ci.yml の frontend ジョブ）と同じ検査。日次でも回すのは
      # 脆弱性 DB が毎日増えるから——依存が1バイトも変わらなくても明日は affected になる
      - name: 依存の既知脆弱性（osv-scanner + pnpm audit --prod）
        run: mise run --quiet web:vuln

      # Node ランタイム自体の CVE は依存を上げても消えない（Go の toolchain と同じ問題）。
      # 外部 API（endoflife.date）に依存するので PR ゲートには入れず日次だけ
      - name: Node ランタイムのパッチ遅れ
        run: dev/scripts/node-version-check.sh

  trivy:
    name: Trivy（設定・シークレット・イメージ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # PR ゲート（ci.yml の trivy ジョブ）は設定とシークレットだけ。日次はイメージも
      # 3本ビルドして検査する——ビルド時にクリーンだったイメージは翌日公表の CVE で
      # 脆弱になる（1バイトも変わっていないのに状態が変わる）
      - name: 設定・シークレット・イメージ（3本ビルド、ignore-unfixed）
        run: mise run --quiet trivy:image
