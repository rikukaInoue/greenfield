# データフロー検査（#192）。gosec(#188) がパターン検査、CodeQL がデータフロー検査という住み分け。
# 深いぶん遅いので PR ごとではなく main への push と週次。結果は Security タブ（Code scanning）。
#
# クエリは既定セットから始める。security-extended への格上げは初回の件数を見て決める
# （ADR 0021: ノイズのある検査は件数を見てから飼い方を決める）。
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # 月曜 06:17 JST。分をずらすのは毎時0分の混雑回避（security.yml と同じ流儀）
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go は none 非対応（初回実行で判明）。autobuild は go.work を見て全モジュールをビルドする
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      # ランナー既定の Go は go.work の要求(>=1.26)より古く autobuild が落ちる（初回実行で実測）
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version: "1.26.6"
          cache: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
