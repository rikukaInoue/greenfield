name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの連続 push は最新だけ走らせる。
# サービス単位の直列/並列制御（#26）は Phase 2.4 でデプロイ側に入れる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 開発用の実装を許す環境であることを明示する。未設定は本番として扱われ、
  # staticauthn などが組み立てられない（docs/adr/0016）
  ENV: ci
  # compose ではなく services: のコンテナを使う。schema-dump.sh はホストの
  # mysql / mysqldump で接続する（MYSQL_CONTAINER が空のとき）
  MYSQL_CONTAINER: ""
  # flagd は立てない。services: では command を渡せず定義を配れないため、
  # 立てても何も検査しない飾りになる（監査 B-2）。
  # 評価はプロセス内で行うので、定義ファイルを直接読めば経路はそのまま通る。
  FLAGS_SOURCE: file
  FLAGS_FILE: deploy/compose/flagd/flags.json

jobs:
  # 変更ファイルと go.mod の replace から、検査すべきモジュールを求める（docs/adr/0015）。
  # main への push は全部を検査する。
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.affected.outputs.go }}
      frontend: ${{ steps.affected.outputs.frontend }}
      keycloak: ${{ steps.affected.outputs.keycloak }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          install: true
          install_args: go
          cache: true

      - name: 対象を判定する
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            go run ./dev/affected -base "origin/$BASE_REF" -github-output "$GITHUB_OUTPUT"
          else
            go run ./dev/affected -all -github-output "$GITHUB_OUTPUT"
          fi

  # モジュール境界の検証はワークスペースを切ったビルドでしか効かない（docs/adr/0006）。
  go:
    name: go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go) }}
    # services: は宣言した時点で全ジョブがコンテナ起動を待つ（実測 27〜35 秒）。
    # DB を使わないモジュールでは丸ごと無駄なので、必要なジョブだけ docker で立てる。
    env:
      # mise のタスク（check / migrate / schema:check 等）をこのモジュールに絞る
      MODULES: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - name: MySQL が要るモジュールか判定する
        id: db
        run: |
          m="${{ matrix.module }}"; m="${m#./}"
          case "$m" in
            # localauthz のテストは MySQL へ到達できないと t.Skip する。
            # 外すとテストが黙って飛ぶので core にも要る（監査 B-1 と同じ形を作らない）
            core) need=true ;;
            # migrations を持つモジュール = サービス。scaffold で増えても自動で拾う
            *) if [ -d "$m/migrations" ]; then need=true; else need=false; fi ;;
          esac
          echo "needed=$need" >> "$GITHUB_OUTPUT"
          echo "$m: mysql=$need"

      # prepare より先に投げておく。起動は mise のインストールと重なるので、
      # services: のように「何もせず待つ」時間にならない。
      - name: MySQL を起動する
        if: steps.db.outputs.needed == 'true'
        run: |
          docker run -d --name mysql -p 13306:3306 \
            -e MYSQL_ROOT_PASSWORD=root mysql:8.4

      - uses: ./.github/actions/prepare
        with:
          cache-key: ${{ matrix.module }}
          mysql: ${{ steps.db.outputs.needed }}

      - name: マイグレーションを適用する
        # expand → contract の順。contract を流さないと sqlc の入力と実行時のスキーマが食い違う（監査 A-2）。
        # サービス以外のモジュールでは対象が無く何もしない
        run: mise run --quiet migrate

      - name: db/schema.sql がマイグレーションと一致するか
        run: mise run --quiet schema:check

      - name: 実行時の DB が db/schema.sql と一致するか
        # schema:check は使い捨てDBとの比較なので、実行時の乖離はこちらでしか検出できない
        run: mise run --quiet schema:check-live

      - name: fmt / build / vet / test / lint / 生成物の一致
        run: mise run --quiet check

      # 依存の CVE を到達性つきで検査する（#180）。matrix でモジュールに絞られるので
      # このジョブでは変更のあったモジュールだけを見る。全モジュールの定期検査は
      # security.yml が担当する（コードが変わらなくても CVE は増える）。
      - name: 依存の CVE（govulncheck）
        run: mise run --quiet vuln

  # database を跨ぐ外部キーを止める(#136)。跨ぐと親の DDL が子のメタデータロックを取り、
  # **他サービスのデプロイが ERROR 1205 で落ちる**（通常の読み書きは通るので日常では気づけない）。
  #
  # **go ジョブに相乗りさせられない。** あちらは MODULES で 1 サービスに絞るので、
  # 適用されるマイグレーションも 1 サービス分だけになる。跨ぐ FK は参照先のテーブルが
  # 無いと張れないので、その状態で検査すると**構造的に必ず「跨ぐ FK は無い」と答える**。
  # だから全サービス分を 1 つの DB に適用する専用ジョブにしてある。
  cross-db-fk:
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # prepare より先に投げる（go ジョブと同じ理由: mise のインストールと起動を重ねる）
      - name: MySQL を起動する
        run: |
          docker run -d --name mysql -p 13306:3306 \
            -e MYSQL_ROOT_PASSWORD=root mysql:8.4

      - uses: ./.github/actions/prepare
        with:
          cache-key: cross-db-fk
          mysql: "true"

      - name: 全サービスのマイグレーションを適用する
        # MODULES を設定しない = 全サービス。ここを絞ると検査が意味を失う
        run: mise run --quiet migrate

      - name: database を跨ぐ外部キーが無いか
        run: mise run --quiet fk:check

  api-breaking:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # base と比較するため履歴が要る
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: 破壊的なAPI変更がないか
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: mise run --quiet api:breaking

  # 設定（Dockerfile / compose / Terraform）とシークレットの検査（#187）。
  # 依存 CVE は go ジョブ（govulncheck）と frontend ジョブ（osv-scanner）の担当なので
  # スキャナを絞る。変更判定に依らず毎回回す——対象がリポジトリ全域で affected の語彙の外
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: 設定・シークレット（canary で検出器の生存確認つき）
        run: mise run --quiet trivy:check

  keycloak:
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # services: では command を渡せず --import-realm で起動できない（flagd と同じ制約。
      # 冒頭の env コメント参照）ため、docker run で compose と同じ形に立てる
      - name: Keycloak を起動する
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/compose/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm

      - name: realm の起動を待つ
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8180/realms/greenfield && exit 0
            sleep 3
          done
          echo "Keycloak が起動しない" >&2
          docker logs keycloak | tail -50
          exit 1

      - name: realm.json どおりのクレームが載るか（check #13）
        run: dev/scripts/keycloak-claims.sh


  # authz サービスの check #7 は実 OpenFGA が要る（判定の導出・consistency hint は
  # モックでは確かめられない）。go マトリクスはビルドとユニットテストを回すが、
  # ここは platform/authz が影響範囲に入ったときだけ実インフラで検証する。
  authz:
    needs: changes
    # photo の配線（oidcauthn+authzhttp）と gear のサービス間結合（4.1）も
    # 一気通貫で確かめるため、photo / gear の変更でも起こす
    if: >-
      contains(fromJSON(needs.changes.outputs.go), './platform/authz') ||
      contains(fromJSON(needs.changes.outputs.go), './services/photo') ||
      contains(fromJSON(needs.changes.outputs.go), './services/gear')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          cache-key: platform-authz

      - name: openfga database を用意する
        run: |
          mysql -h 127.0.0.1 -P 13306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS openfga CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER IF NOT EXISTS 'openfga'@'%' IDENTIFIED BY 'openfga'; GRANT ALL PRIVILEGES ON openfga.* TO 'openfga'@'%'; FLUSH PRIVILEGES;"

      - name: OpenFGA を起動する（mysql datastore）
        run: |
          docker run --rm --network host \
            -e OPENFGA_DATASTORE_ENGINE=mysql \
            -e OPENFGA_DATASTORE_URI="openfga:openfga@tcp(127.0.0.1:13306)/openfga?parseTime=true" \
            openfga/openfga:v1.8 migrate
          docker run -d --name openfga --network host \
            -e OPENFGA_DATASTORE_ENGINE=mysql \
            -e OPENFGA_DATASTORE_URI="openfga:openfga@tcp(127.0.0.1:13306)/openfga?parseTime=true" \
            -e OPENFGA_PLAYGROUND_ENABLED=false \
            openfga/openfga:v1.8 run

      - name: authz サービスを起動する
        run: |
          ( cd platform/authz && GOWORK=off go run ./cmd/authz & )
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8100/healthz && exit 0
            sleep 2
          done
          echo "authz が起動しない" >&2
          docker logs openfga | tail -30
          exit 1
        env:
          OPENFGA_URL: http://localhost:8080

      - name: 認可の判定・一覧・冪等・作成直後可視（check #7）
        run: dev/scripts/authz-check.sh

      # --- ここから 3.3: 本番アダプタへの差し替えの一気通貫（#27） ---
      - name: Keycloak を起動する
        run: |
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_PORT=8180 \
            -v "$PWD/deploy/compose/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8180/realms/greenfield && exit 0
            sleep 3
          done
          echo "Keycloak が起動しない" >&2; docker logs keycloak | tail -30; exit 1

      - name: authz を OIDC 付きで起動する（:8101。dev モードとはポートを分ける）
        # 以前はここで旧(devモード)を pkill して :8100 を使い回していたが、
        # **旧プロセスは pkill -f 'exe/authz' にも -9 にも掛からず生き残る**ことが
        # run 36529558075 で確定した(新は bind: address already in use で即死し、
        # healthz ポーリングが旧に当たって検査が dev モード相手に走る = 400)。
        # プロセスの後始末に依存するのをやめ、OIDC 実体は別ポートに立てて
        # 以降のステップを全部そちらへ向ける(#160)。旧は :8100 で放置してよい
        # (authz-check の役目は終わっており、他の何もそこを見ない)。
        run: |
          ( cd platform/authz && GOWORK=off \
            AUTHZ_ADDR=:8101 \
            OIDC_ISSUER=http://localhost:8180/realms/greenfield \
            OPENFGA_URL=http://localhost:8080 \
            go run ./cmd/authz & )
          # healthz は dev/OIDC を区別できない(どちらも 200)ので readiness にならない。
          # 無トークンの POST /check は OIDC=401 / dev=400(空 JSON はデコードを通って
          # バリデーション落ち)なので、401 だけを「OIDC の実体が立った」とみなす
          c=000
          for i in $(seq 1 40); do
            c=$(curl -s -o /dev/null -w "%{http_code}" -m 2 -X POST http://localhost:8101/check \
              -H "Content-Type: application/json" -d '{}' || echo 000)
            if [ "$c" = 401 ]; then exit 0; fi
            sleep 2
          done
          echo "authz(OIDC) が :8101 で起動しない (last=$c)" >&2
          exit 1
        env:
          ENV: ci

      - name: photo と gear のマイグレーションを流す
        run: MODULES="./services/photo ./services/gear" mise run --quiet migrate

      - name: photo を本番アダプタ（OIDCDeps）で起動する
        run: |
          ( cd services/photo && GOWORK=off \
            OIDC_ISSUER=http://localhost:8180/realms/greenfield \
            AUTHZ_URL=http://localhost:8101 \
            M2M_TOKEN_URL=http://localhost:8180/realms/greenfield/protocol/openid-connect/token \
            M2M_CLIENT_SECRET=svc-photo-dev-secret \
            GEAR_INTERNAL_URL=http://localhost:18091 \
            AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=testtest AWS_REGION=us-east-1 \
            PHOTO_IMAGE_BUCKET=photo-images \
            PHOTO_EXTERNAL_ADDR=:18080 PHOTO_INTERNAL_ADDR=:18081 PHOTO_ADMIN_ADDR=:18082 \
            go run ./cmd/photo & )
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:18080/healthz && exit 0
            sleep 2
          done
          echo "photo が起動しない" >&2; exit 1

      - name: 差し替え後の認証・認可の一気通貫（#27）
        run: dev/scripts/authn-check.sh
        env:
          PHOTO_EXTERNAL_URL: http://localhost:18080
          PHOTO_INTERNAL_URL: http://localhost:18081
          AUTHZ_URL: http://localhost:8101

      # gear はまだ起動していない = 「gear 停止中」を作らずに得られる（4.4 / check #11 前半）
      - name: gear 停止中の紐付け要求が pending で成立する（#11 前半）
        run: dev/scripts/pending-check.sh request
        env:
          PHOTO_EXTERNAL_URL: http://localhost:18080
          GEAR_INTERNAL_URL: http://localhost:18091
          PENDING_CHECK_STATE: /tmp/pending-check-state

      # --- ここから 4.1: サービス間結合（gear→photo の M2M） ---
      - name: gear を本番アダプタ（OIDCDeps）で起動する
        run: |
          ( cd services/gear && GOWORK=off \
            OIDC_ISSUER=http://localhost:8180/realms/greenfield \
            PHOTO_INTERNAL_URL=http://localhost:18081 \
            M2M_TOKEN_URL=http://localhost:8180/realms/greenfield/protocol/openid-connect/token \
            M2M_CLIENT_SECRET=svc-gear-dev-secret \
            GEAR_EXTERNAL_ADDR=:18090 GEAR_INTERNAL_ADDR=:18091 GEAR_ADMIN_ADDR=:18092 \
            go run ./cmd/gear & )
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:18090/healthz && exit 0
            sleep 2
          done
          echo "gear が起動しない" >&2; exit 1

      - name: サービス間結合の一気通貫（4.1）
        run: dev/scripts/s2s-check.sh
        env:
          GEAR_EXTERNAL_URL: http://localhost:18090

      - name: 回収ジョブが pending を確定させる（#11 後半）
        run: dev/scripts/pending-check.sh settle
        env:
          PHOTO_EXTERNAL_URL: http://localhost:18080
          PENDING_CHECK_STATE: /tmp/pending-check-state
          RECLAIM_CMD: >-
            env -C services/photo GOWORK=off
            OIDC_ISSUER=http://localhost:8180/realms/greenfield
            AUTHZ_URL=http://localhost:8101
            M2M_TOKEN_URL=http://localhost:8180/realms/greenfield/protocol/openid-connect/token
            M2M_CLIENT_SECRET=svc-photo-dev-secret
            GEAR_INTERNAL_URL=http://localhost:18091
            AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=testtest AWS_REGION=us-east-1
            PHOTO_IMAGE_BUCKET=photo-images
            go run ./cmd/photo reclaim-links --older-than 0s


  # Eventual（outbox + relay + SNS/SQS + inbox。4.2）。authz ジョブとは依存が違う
  # （Keycloak も OpenFGA も要らず、代わりに LocalStack が要る）ので分ける。
  eventual:
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.go), './core') ||
      contains(fromJSON(needs.changes.outputs.go), './services/photo') ||
      contains(fromJSON(needs.changes.outputs.go), './services/gear')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: MySQL と LocalStack を起動する
        run: |
          docker run -d --name mysql -p 13306:3306 -e MYSQL_ROOT_PASSWORD=root mysql:8.4
          docker run -d --name localstack -p 4566:4566 -e SERVICES=sns,sqs localstack/localstack:4

      - uses: ./.github/actions/prepare
        with:
          cache-key: eventual
          mysql: "true"

      - name: photo と gear のマイグレーションを流す
        run: MODULES="./services/photo ./services/gear" mise run --quiet migrate

      - name: LocalStack の起動を待ちトピック・キューを用意する
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4566/_localstack/health && break
            sleep 2
          done
          go run ./dev/eventadmin ensure-topics

      - name: 配送の一気通貫（#8 relay停止→回復 / #9 重複無害化）
        run: dev/scripts/eventual-check.sh
        env:
          LOCALSTACK_CONTAINER: localstack

      - name: ReplicaView の再構築一致（#10）
        run: dev/scripts/replica-check.sh


  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: test
          RUSTFS_SECRET_KEY: testtest
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          cache-key: frontend

      - name: RustFS の起動を待つ
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && exit 0
            sleep 2
          done
          echo "RustFS が起動しない" >&2
          exit 1

      - name: バケットを用意する
        run: mise run --quiet s3:up

      - name: マイグレーションを適用する
        run: mise run --quiet migrate

      - name: 生成型の一致 / typecheck / build
        run: mise run --quiet web:check

      # 依存の既知脆弱性（#183）。npm には govulncheck 相当の到達性解析が無いので
      # 件数が出る前提で差分運用（ADR 0021）に乗せる。日次の再検査は security.yml
      - name: 依存の既知脆弱性（osv-scanner + pnpm audit --prod）
        run: mise run --quiet web:vuln

      - name: Playwright のブラウザを用意する
        working-directory: frontend/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E 用に photo と SSR を起動する
        run: |
          go build -o "$RUNNER_TEMP/allinone" ./dev/allinone
          nohup "$RUNNER_TEMP/allinone" > "$RUNNER_TEMP/allinone.log" 2>&1 &
          (cd frontend/apps/web && PORT=3000 nohup pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &)
          for url in http://localhost:8080/healthz http://localhost:3000/login; do
            for i in $(seq 1 60); do curl -sf -o /dev/null "$url" && continue 2; sleep 1; done
            echo "$url が起動しない" >&2; exit 1
          done

      # 水平権限昇格は既製の検査から出ない（ZAP は 200 を正常として通す）。
      # ルート一覧はハンドラ登録の実体から取るので、経路が増えれば対象も自動で増える
      - name: 認可の総当たり（#182。全経路 × 他人のトークン / 無認証）
        run: mise run --quiet authz:sweep

      # --- OIDC 経路（5.2）: confidential client の実 Keycloak ログインを別インスタンスで検証する ---
      - name: Keycloak / OpenFGA / authz / photo(OIDC) / SSR(OIDC) を起動する
        run: |
          docker run -d --name keycloak --network host             -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin             -e KC_HTTP_PORT=8180             -v "$PWD/deploy/compose/keycloak:/opt/keycloak/data/import:ro"             quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          mysql -h 127.0.0.1 -P 13306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS openfga; CREATE USER IF NOT EXISTS 'openfga'@'%' IDENTIFIED BY 'openfga'; GRANT ALL PRIVILEGES ON openfga.* TO 'openfga'@'%'; FLUSH PRIVILEGES;"
          docker run --rm --network host -e OPENFGA_DATASTORE_ENGINE=mysql             -e OPENFGA_DATASTORE_URI="openfga:openfga@tcp(127.0.0.1:13306)/openfga?parseTime=true"             openfga/openfga:v1.8 migrate
          docker run -d --name openfga --network host -e OPENFGA_DATASTORE_ENGINE=mysql             -e OPENFGA_DATASTORE_URI="openfga:openfga@tcp(127.0.0.1:13306)/openfga?parseTime=true"             -e OPENFGA_HTTP_ADDR=0.0.0.0:8280 -e OPENFGA_PLAYGROUND_ENABLED=false openfga/openfga:v1.8 run
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8180/realms/greenfield && break
            sleep 3
          done
          ( cd platform/authz && GOWORK=off             OIDC_ISSUER=http://localhost:8180/realms/greenfield             OPENFGA_URL=http://localhost:8280 AUTHZ_ADDR=:8101             go run ./cmd/authz > "$RUNNER_TEMP/authz.log" 2>&1 & )
          ( cd services/photo && GOWORK=off             OIDC_ISSUER=http://localhost:8180/realms/greenfield             AUTHZ_URL=http://localhost:8101             M2M_TOKEN_URL=http://localhost:8180/realms/greenfield/protocol/openid-connect/token             M2M_CLIENT_SECRET=svc-photo-dev-secret             GEAR_INTERNAL_URL=http://localhost:18091             AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=testtest AWS_REGION=us-east-1             AWS_ENDPOINT_URL=http://localhost:9000 PHOTO_IMAGE_BUCKET=photo-images             PHOTO_EXTERNAL_ADDR=:18080 PHOTO_INTERNAL_ADDR=:18081 PHOTO_ADMIN_ADDR=:18082             go run ./cmd/photo > "$RUNNER_TEMP/photo-oidc.log" 2>&1 & )
          ( cd frontend/apps/web && PORT=3001 ENV=ci DEV_LOGIN=false             OIDC_ISSUER=http://localhost:8180/realms/greenfield             PHOTO_API_URL=http://localhost:18080 GEAR_API_URL=http://localhost:18090             SESSION_DIR="$RUNNER_TEMP/ssr-sessions"             nohup pnpm start > "$RUNNER_TEMP/web-oidc.log" 2>&1 & )
          for url in http://localhost:18080/healthz http://localhost:3001/login; do
            for i in $(seq 1 90); do curl -sf -o /dev/null "$url" && continue 2; sleep 2; done
            echo "$url が起動しない" >&2; exit 1
          done

      - name: ブラウザ E2E（投稿の3段 / #17 トークン非露出・CORS 閉 / OIDC ログイン）
        timeout-minutes: 10
        run: mise run --quiet web:e2e
        env:
          OIDC_WEB_URL: http://localhost:3001

      - name: E2E のサーバーログ
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/allinone.log" "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/web-oidc.log" "$RUNNER_TEMP/photo-oidc.log" "$RUNNER_TEMP/authz.log" 2>/dev/null || true

      - name: E2E のトレースを保存する
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/apps/web/test-results/
          retention-days: 7

  # 結果の集約。スキップは成功として扱い、失敗・中断が1つでもあれば落ちる。
  # ブランチ保護の必須チェックはこのジョブだけを指定すればよい（対象外のジョブがスキップでも通る）。
  check:
    if: always()
    needs: [changes, go, cross-db-fk, api-breaking, frontend, keycloak, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: 結果をまとめる
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "失敗したジョブがある" >&2
            exit 1
          fi
