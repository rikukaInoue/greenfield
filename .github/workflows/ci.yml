name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの連続 push は最新だけ走らせる。
# サービス単位の直列/並列制御（#26）は Phase 2.4 でデプロイ側に入れる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 開発用の実装を許す環境であることを明示する。未設定は本番として扱われ、
  # staticauthn などが組み立てられない（docs/adr/0016）
  ENV: ci
  # compose ではなく services: のコンテナを使う。schema-dump.sh はホストの
  # mysql / mysqldump で接続する（MYSQL_CONTAINER が空のとき）
  MYSQL_CONTAINER: ""
  # flagd は立てない。services: では command を渡せず定義を配れないため、
  # 立てても何も検査しない飾りになる（監査 B-2）。
  # 評価はプロセス内で行うので、定義ファイルを直接読めば経路はそのまま通る。
  FLAGS_SOURCE: file
  FLAGS_FILE: deploy/compose/flagd/flags.json

jobs:
  # 変更ファイルと go.mod の replace から、検査すべきモジュールを求める（docs/adr/0015）。
  # main への push は全部を検査する。
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.affected.outputs.go }}
      frontend: ${{ steps.affected.outputs.frontend }}
      keycloak: ${{ steps.affected.outputs.keycloak }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install: true
          install_args: go
          cache: true

      - name: 対象を判定する
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            go run ./dev/affected -base "origin/$BASE_REF" -github-output "$GITHUB_OUTPUT"
          else
            go run ./dev/affected -all -github-output "$GITHUB_OUTPUT"
          fi

  # モジュール境界の検証はワークスペースを切ったビルドでしか効かない（docs/adr/0006）。
  go:
    name: go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go) }}
    # services: は宣言した時点で全ジョブがコンテナ起動を待つ（実測 27〜35 秒）。
    # DB を使わないモジュールでは丸ごと無駄なので、必要なジョブだけ docker で立てる。
    env:
      # mise のタスク（check / migrate / schema:check 等）をこのモジュールに絞る
      MODULES: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: MySQL が要るモジュールか判定する
        id: db
        run: |
          m="${{ matrix.module }}"; m="${m#./}"
          case "$m" in
            # localauthz のテストは MySQL へ到達できないと t.Skip する。
            # 外すとテストが黙って飛ぶので core にも要る（監査 B-1 と同じ形を作らない）
            core) need=true ;;
            # migrations を持つモジュール = サービス。scaffold で増えても自動で拾う
            *) if [ -d "$m/migrations" ]; then need=true; else need=false; fi ;;
          esac
          echo "needed=$need" >> "$GITHUB_OUTPUT"
          echo "$m: mysql=$need"

      # prepare より先に投げておく。起動は mise のインストールと重なるので、
      # services: のように「何もせず待つ」時間にならない。
      - name: MySQL を起動する
        if: steps.db.outputs.needed == 'true'
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root mysql:8.4

      - uses: ./.github/actions/prepare
        with:
          cache-key: ${{ matrix.module }}
          mysql: ${{ steps.db.outputs.needed }}

      - name: マイグレーションを適用する
        # expand → contract の順。contract を流さないと sqlc の入力と実行時のスキーマが食い違う（監査 A-2）。
        # サービス以外のモジュールでは対象が無く何もしない
        run: mise run --quiet migrate

      - name: db/schema.sql がマイグレーションと一致するか
        run: mise run --quiet schema:check

      - name: 実行時の DB が db/schema.sql と一致するか
        # schema:check は使い捨てDBとの比較なので、実行時の乖離はこちらでしか検出できない
        run: mise run --quiet schema:check-live

      - name: fmt / build / vet / test / lint / 生成物の一致
        run: mise run --quiet check

  # database を跨ぐ外部キーを止める(#136)。跨ぐと親の DDL が子のメタデータロックを取り、
  # **他サービスのデプロイが ERROR 1205 で落ちる**（通常の読み書きは通るので日常では気づけない）。
  #
  # **go ジョブに相乗りさせられない。** あちらは MODULES で 1 サービスに絞るので、
  # 適用されるマイグレーションも 1 サービス分だけになる。跨ぐ FK は参照先のテーブルが
  # 無いと張れないので、その状態で検査すると**構造的に必ず「跨ぐ FK は無い」と答える**。
  # だから全サービス分を 1 つの DB に適用する専用ジョブにしてある。
  cross-db-fk:
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prepare より先に投げる（go ジョブと同じ理由: mise のインストールと起動を重ねる）
      - name: MySQL を起動する
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root mysql:8.4

      - uses: ./.github/actions/prepare
        with:
          cache-key: cross-db-fk
          mysql: "true"

      - name: 全サービスのマイグレーションを適用する
        # MODULES を設定しない = 全サービス。ここを絞ると検査が意味を失う
        run: mise run --quiet migrate

      - name: database を跨ぐ外部キーが無いか
        run: mise run --quiet fk:check

  api-breaking:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base と比較するため履歴が要る
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: 破壊的なAPI変更がないか
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: mise run --quiet api:breaking

  keycloak:
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # services: では command を渡せず --import-realm で起動できない（flagd と同じ制約。
      # 冒頭の env コメント参照）ため、docker run で compose と同じ形に立てる
      - name: Keycloak を起動する
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/compose/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm

      - name: realm の起動を待つ
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8180/realms/greenfield && exit 0
            sleep 3
          done
          echo "Keycloak が起動しない" >&2
          docker logs keycloak | tail -50
          exit 1

      - name: realm.json どおりのクレームが載るか（check #13）
        run: dev/scripts/keycloak-claims.sh


  # authz サービスの check #7 は実 OpenFGA が要る（判定の導出・consistency hint は
  # モックでは確かめられない）。go マトリクスはビルドとユニットテストを回すが、
  # ここは platform/authz が影響範囲に入ったときだけ実インフラで検証する。
  authz:
    needs: changes
    # photo の配線（oidcauthn+authzhttp）も一気通貫で確かめるため、photo の変更でも起こす
    if: >-
      contains(fromJSON(needs.changes.outputs.go), './platform/authz') ||
      contains(fromJSON(needs.changes.outputs.go), './services/photo')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare
        with:
          cache-key: platform-authz

      - name: openfga database を用意する
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS openfga CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER IF NOT EXISTS 'openfga'@'%' IDENTIFIED BY 'openfga'; GRANT ALL PRIVILEGES ON openfga.* TO 'openfga'@'%'; FLUSH PRIVILEGES;"

      - name: OpenFGA を起動する（mysql datastore）
        run: |
          docker run --rm --network host \
            -e OPENFGA_DATASTORE_ENGINE=mysql \
            -e OPENFGA_DATASTORE_URI="openfga:openfga@tcp(127.0.0.1:3306)/openfga?parseTime=true" \
            openfga/openfga:v1.8 migrate
          docker run -d --name openfga --network host \
            -e OPENFGA_DATASTORE_ENGINE=mysql \
            -e OPENFGA_DATASTORE_URI="openfga:openfga@tcp(127.0.0.1:3306)/openfga?parseTime=true" \
            -e OPENFGA_PLAYGROUND_ENABLED=false \
            openfga/openfga:v1.8 run

      - name: authz サービスを起動する
        run: |
          ( cd platform/authz && GOWORK=off go run ./cmd/authz & )
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8100/healthz && exit 0
            sleep 2
          done
          echo "authz が起動しない" >&2
          docker logs openfga | tail -30
          exit 1
        env:
          OPENFGA_URL: http://localhost:8080

      - name: 認可の判定・一覧・冪等・作成直後可視（check #7）
        run: dev/scripts/authz-check.sh

      # --- ここから 3.3: 本番アダプタへの差し替えの一気通貫（#27） ---
      - name: Keycloak を起動する
        run: |
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_PORT=8180 \
            -v "$PWD/deploy/compose/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8180/realms/greenfield && exit 0
            sleep 3
          done
          echo "Keycloak が起動しない" >&2; docker logs keycloak | tail -30; exit 1

      - name: authz を OIDC 付きで再起動する
        run: |
          pkill -f 'exe/authz' 2>/dev/null || true
          sleep 1
          ( cd platform/authz && GOWORK=off \
            OIDC_ISSUER=http://localhost:8180/realms/greenfield \
            OPENFGA_URL=http://localhost:8080 \
            go run ./cmd/authz & )
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8100/healthz && exit 0
            sleep 2
          done
          echo "authz が起動しない" >&2; exit 1
        env:
          ENV: ci

      - name: photo のマイグレーションを流す
        run: MODULES=./services/photo mise run --quiet migrate

      - name: photo を本番アダプタ（OIDCDeps）で起動する
        run: |
          ( cd services/photo && GOWORK=off \
            OIDC_ISSUER=http://localhost:8180/realms/greenfield \
            AUTHZ_URL=http://localhost:8100 \
            M2M_TOKEN_URL=http://localhost:8180/realms/greenfield/protocol/openid-connect/token \
            M2M_CLIENT_SECRET=svc-photo-dev-secret \
            PHOTO_EXTERNAL_ADDR=:18080 PHOTO_INTERNAL_ADDR=:18081 PHOTO_ADMIN_ADDR=:18082 \
            go run ./cmd/photo & )
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:18080/healthz && exit 0
            sleep 2
          done
          echo "photo が起動しない" >&2; exit 1

      - name: 差し替え後の認証・認可の一気通貫（#27）
        run: dev/scripts/authn-check.sh
        env:
          PHOTO_EXTERNAL_URL: http://localhost:18080
          PHOTO_INTERNAL_URL: http://localhost:18081


  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: test
          RUSTFS_SECRET_KEY: testtest
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare
        with:
          cache-key: frontend

      - name: RustFS の起動を待つ
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && exit 0
            sleep 2
          done
          echo "RustFS が起動しない" >&2
          exit 1

      - name: バケットを用意する
        run: mise run --quiet s3:up

      - name: マイグレーションを適用する
        run: mise run --quiet migrate

      - name: 生成型の一致 / typecheck / build
        run: mise run --quiet web:check

      - name: Playwright のブラウザを用意する
        working-directory: frontend/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E 用に photo と SSR を起動する
        run: |
          go build -o "$RUNNER_TEMP/allinone" ./dev/allinone
          nohup "$RUNNER_TEMP/allinone" > "$RUNNER_TEMP/allinone.log" 2>&1 &
          (cd frontend/apps/web && PORT=3000 nohup pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &)
          for url in http://localhost:8080/healthz http://localhost:3000/login; do
            for i in $(seq 1 60); do curl -sf -o /dev/null "$url" && continue 2; sleep 1; done
            echo "$url が起動しない" >&2; exit 1
          done

      - name: ブラウザ E2E（投稿の3段 / #17 トークン非露出・CORS 閉）
        timeout-minutes: 10
        run: mise run --quiet web:e2e

      - name: E2E のサーバーログ
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/allinone.log" "$RUNNER_TEMP/web.log"

      - name: E2E のトレースを保存する
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/apps/web/test-results/
          retention-days: 7

  # 結果の集約。スキップは成功として扱い、失敗・中断が1つでもあれば落ちる。
  # ブランチ保護の必須チェックはこのジョブだけを指定すればよい（対象外のジョブがスキップでも通る）。
  check:
    if: always()
    needs: [changes, go, cross-db-fk, api-breaking, frontend, keycloak]
    runs-on: ubuntu-latest
    steps:
      - name: 結果をまとめる
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "失敗したジョブがある" >&2
            exit 1
          fi
