packages:
  - apps/*
  - packages/*

# npm サプライチェーンの2つのガード（#184）。
#
# allowBuilds: 依存の install/postinstall スクリプトは、ここに列挙した
# パッケージしか実行されない（pnpm v10+ は既定で全拒否。空リストを明示するのは
# 「未設定だから拒否されている」でなく「拒否を選んだ」を宣言するため。ADR 0016 の
# 許可リスト主義と同じ形）。2026-09-30 時点、ビルドスクリプトが必要な依存は 0 件。
# 新しい依存が必要とした場合はここへの追記が PR diff に出て、レビューで目に入る。
allowBuilds: {}

# 公開から3日未満のバージョンを掴まない（分単位）。乗っ取り→即公開→即取り込みの
# 窓を閉じる。CVE 対応で急ぐときは --config.minimum-release-age=0 で一時的に外す
minimumReleaseAge: 4320
